<!-- Load the Perfect DOS VGA 437 font -->
<link rel="preconnect" href="https://fonts.cdnfonts.com" />
<link href="https://fonts.cdnfonts.com/css/perfect-dos-vga-437" rel="stylesheet">

<!-- Ensure proper font loading -->
<style>
  @font-face {
    font-family: 'Perfect DOS VGA 437';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('https://fonts.cdnfonts.com/s/6240/Perfect DOS VGA 437.woff') format('woff');
  }
</style>

<!-- Apply DOS amber theme globally -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('data-theme', 'dos-amber');
    document.body.setAttribute('data-theme', 'dos-amber');
  });
</script>

<!-- Inline critical amber theme tokens -->
<style>
  :root, [data-theme="dos-amber"], .theme-dos-amber {
    /* P3 Phosphor Amber Palette */
    --color-cga-amber: #ffb000;
    --color-cga-amber-bright: #fdca9f;
    --color-cga-amber-dim: #9a5700;
    --color-cga-black: #000000;

    /* Semantic overrides for amber */
    --color-semantic-background-primary: #000000;
    --color-semantic-background-secondary: #0a0a00;
    --color-semantic-text-primary: #ffb000;
    --color-semantic-text-secondary: #fdca9f;
    --color-semantic-text-accent: #ffff55;
    --color-semantic-text-disabled: #9a5700;
    --color-semantic-border-default: #ffb000;
    --color-semantic-border-focus: #fdca9f;
    --color-semantic-link-default: #ffb000;
    --color-semantic-link-hover: #fdca9f;

    /* Typography */
    --typography-font-family-primary: 'Perfect DOS VGA 437', Consolas, Monaco, monospace;
  }

  body, .sb-show-main, #storybook-root {
    background: #000000 !important;
    color: #ffb000 !important;
    font-family: 'Perfect DOS VGA 437', Consolas, Monaco, monospace !important;
  }
</style>
