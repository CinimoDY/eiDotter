# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Jest 30.5 forbids module.register() inside tests; Storybook 10 calls it
      # when @storybook/test-runner loads the TS config, so the axe gate in CI
      # cannot start (PR #567). Remove once Storybook or the test runner ships
      # a fix; @storybook/test-runner 0.26.0 is the latest as of 2026-10-25.
      - dependency-name: "jest"
        versions: [">=30.5.0"]
      - dependency-name: "jest-environment-jsdom"
        versions: [">=30.5.0"]
    groups:
      # Group minor/patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Storybook updates
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      # Testing updates
      testing:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "@types/jest"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
