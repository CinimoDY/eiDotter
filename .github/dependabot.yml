# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # Group minor/patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Storybook updates
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      # Testing updates
      testing:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "@types/jest"
    # Transitive-only deps whose security-update jobs can never resolve:
    # direct devDependencies (@storybook/test-runner, storybook/addon-a11y,
    # jest's istanbuljs coverage stack) pin them to vulnerable ranges
    # upstream hasn't fixed yet, so every retry fails the same way and
    # spams the "Dependabot Updates" workflow (DMNC-1324). The real fix
    # arrives via the normal grouped update once those direct deps release
    # compatible versions — see solutions/workflow-issues/ for the full
    # root cause and remove an entry once its upstream pin is fixed.
    ignore:
      - dependency-name: "js-yaml"
      - dependency-name: "uuid"
      - dependency-name: "esbuild"
      - dependency-name: "@babel/core"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
