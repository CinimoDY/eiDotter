name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check token freshness
      run: |
        npm run build-tokens
        git diff --exit-code -- \
          src/styles/tokens.css \
          src/styles/tokens.js \
          src/styles/tokens.json \
          src/styles/theme.*.css \
          src/styles/shadcn.css \
          tailwind.preset.cjs \
          platforms/swiftui/Sources/EiDotterTokens/

    - name: Check Apple Swift snapshot freshness
      run: |
        npm run sync-figma-to-swift
        git diff --exit-code -- \
          platforms/swiftui/Sources/EiDotterTokens/AppleIOS.swift \
          platforms/swiftui/Sources/EiDotterTokens/AppleMacOS.swift

    - name: Lint token references
      run: npm run lint-tokens

    - name: Lint (ESLint)
      run: npm run lint

    - name: Check 'use client' directives (RSC source-of-truth)
      run: node scripts/sync-client-directives.mjs --check

    - name: Create env file
      run: |
        echo "FIGMA_ACCESS_TOKEN=" >> .env
        echo "FIGMA_FILE_KEY=qlEyN6zHPX4XOohJefJ4bZ" >> .env

    - name: Build
      run: npm run build
      env:
        NODE_ENV: production

    - name: Assert RSC safety (per-component emit)
      run: node scripts/assert-rsc-safety.mjs

    - name: Run tests
      run: npm test -- --ci
      env:
        NODE_ENV: test

    - name: Build Storybook
      run: npm run build-storybook
      env:
        NODE_ENV: production

    - name: Install Playwright browser (axe gate)
      run: npx playwright install --with-deps chromium

    - name: Axe a11y regression gate
      run: |
        python3 -m http.server 6007 --directory docs --bind 127.0.0.1 &
        npx wait-on tcp:127.0.0.1:6007
        npm run test-a11y
      env:
        A11Y_FAIL_ON_VIOLATION: '1'
        A11Y_REPORT_PATH: /tmp/a11y-ci-report.jsonl

    - name: Upload a11y report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: a11y-report
        path: /tmp/a11y-ci-report.jsonl
        if-no-files-found: ignore
