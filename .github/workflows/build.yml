name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Configure UTI Pro registry
      env:
        UTI_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}
      run: echo "//pkg.untitledui.com/:_authToken=${UTI_TOKEN}" >> .npmrc

    - name: Install dependencies
      run: npm ci
      
    - name: Create env file
      run: |
        echo "FIGMA_ACCESS_TOKEN=" >> .env
        echo "FIGMA_FILE_KEY=qlEyN6zHPX4XOohJefJ4bZ" >> .env
    
    - name: Build
      run: npm run build
      env:
        NODE_ENV: production
    
    - name: Build Storybook
      run: npm run build-storybook
      env:
        NODE_ENV: production 