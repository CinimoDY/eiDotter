name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Configure UTI Pro registry
      env:
        UTI_TOKEN: ${{ secrets.UNTITLEDUI_PRO_TOKEN }}
      run: echo "//pkg.untitledui.com/:_authToken=${UTI_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
