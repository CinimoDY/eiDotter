name: Claude Code Review
# One automatic review per PR from a branch in this repo: when it opens as ready or
# leaves draft. Later pushes do not re-run it; comment "@claude review this PR" for
# another pass. Bot authors (dependabot) are skipped, and fork PRs get no secret.
#
# The review runs as a single agent with a direct prompt. The official code-review
# plugin is not used: its recipe dispatches subagents, which current Claude Code
# runs asynchronously, and the headless parent exits before they report (seen
# 2026-10-22: every review ended after ~10 s with no findings).
#
# Note: the action only runs when this file is identical to the copy on main, so a
# PR branched before a change to this file is skipped until it is updated with main.
# Docs: https://code.claude.com/docs/en/github-actions
on:
  pull_request:
    types: [opened, ready_for_review]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.user.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --disallowedTools "Agent"
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Work alone in this session: do not use the Agent tool or launch subagents.

            1. Run `gh pr view ${{ github.event.pull_request.number }} --json state,isDraft,title,body` and
               `gh pr view ${{ github.event.pull_request.number }} --comments`. Stop without posting if the
               PR is closed, is a draft, or already has a comment from a "claude" account.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}`. Read the root CLAUDE.md and any
               CLAUDE.md in directories that contain changed files. Use Read, Grep and Glob on the
               checked-out repository when a diff hunk needs surrounding context.
            3. Look only for high-signal problems in the changed code:
               - code that will not compile or parse (type errors, missing imports, unresolved references)
               - logic that definitely produces wrong results regardless of input
               - clear CLAUDE.md violations where you can quote the rule
               Do not flag style, speculative or input-dependent issues, pre-existing problems, anything a
               linter catches, or general quality concerns. If you are not certain, do not flag it.
            4. For each confirmed issue, post exactly one inline comment with
               mcp__github_inline_comment__create_inline_comment (confirmed: true): a brief description,
               the reason (bug or the CLAUDE.md rule), and a committable suggestion only when applying it
               fixes the issue completely.
            5. If there are no issues, post this comment with `gh pr comment`:
               "## Code review\n\nNo issues found. Checked for bugs and CLAUDE.md compliance."
            6. Finish with a one-line summary of what you checked and posted.
