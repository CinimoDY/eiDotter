name: Claude Code Review
# Reviews each PR from a branch in this repo once, when it opens as ready or leaves
# draft, and posts inline comments. Later pushes do not re-run it; ask with @claude.
# Skips bot authors (dependabot) since the action rejects bot actors and secrets
# are withheld on fork PRs anyway. Docs: https://code.claude.com/docs/en/github-actions#run-a-skill
on:
  pull_request:
    types: [opened, ready_for_review]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.user.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Diagnostic: print the agent trace so the review depth can be inspected. Revert after.
          show_full_output: true
